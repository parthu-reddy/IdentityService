# Isolated instance of the existing authority, sharing its current account/session stores.
# Environment/Config Server must supply real credentials. No development key or TLS fallback.
identity:
  maps:
    enabled: true
    authority: ${MAPS_IDENTITY_AUTHORITY}
    audience: ${MAPS_IDENTITY_AUDIENCE}
    signing-key-id: ${MAPS_IDENTITY_SIGNING_KEY_ID}
    private-key: ${MAPS_IDENTITY_SIGNING_KEY_FILE}
    verification-key: ${MAPS_IDENTITY_VERIFY_KEY_FILE}
    allowed-peers: ${MAPS_IDENTITY_ALLOWED_PEERS}
    credential-lifetime: PT15M
    decision-lifetime: PT1S
    request-timeout: PT2S
    concurrency: 8
server:
  port: ${MAPS_IDENTITY_PORT:8446}
  ssl:
    enabled: true
    enabled-protocols: TLSv1.3,TLSv1.2
    client-auth: need
    key-store: ${MAPS_IDENTITY_TLS_KEY_STORE}
    key-store-type: PKCS12
    key-store-password: ${MAPS_IDENTITY_TLS_KEY_STORE_PASSWORD}
    trust-store: ${MAPS_IDENTITY_TLS_TRUST_STORE}
    trust-store-type: PKCS12
    trust-store-password: ${MAPS_IDENTITY_TLS_TRUST_STORE_PASSWORD}
  tomcat:
    max-connections: 128
    accept-count: 32
    threads:
      max: 32
      min-spare: 4
    connection-timeout: 2s
    keep-alive-timeout: 30s
spring:
  data:
    redis:
      connect-timeout: 350ms
      timeout: 350ms
  datasource:
    hikari:
      maximum-pool-size: 8
      minimum-idle: 1
      connection-timeout: 250
      validation-timeout: 250
  jpa:
    properties:
      jakarta.persistence.query.timeout: 1000
      hibernate.cache.use_second_level_cache: false
      hibernate.cache.use_query_cache: false
management:
  server:
    port: ${MAPS_IDENTITY_MANAGEMENT_PORT:9086}
    address: 127.0.0.1
    # Otherwise it inherits server.ssl and its client-auth: need, so nothing on this loopback port could check health.
    ssl:
      enabled: false
  tracing:
    sampling:
      probability: 0.05
# SQL exception text can contain unique-key values supplied by a caller. Keep
# the fixed Maps operation/stage/cause log; suppress ORM SQL/value diagnostics.
logging:
  level:
    org.hibernate.SQL: "OFF"
    org.hibernate.orm.jdbc.bind: "OFF"
    org.hibernate.engine.jdbc.spi.SqlExceptionHelper: "OFF"
    org.hibernate.event.internal.DefaultLoadEventListener: "OFF"
